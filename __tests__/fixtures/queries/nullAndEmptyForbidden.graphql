# All queries in this file should throw an error
# (queries are an exact copy of nullAndEmptyAllowed.graphql)
query {
  a: allFilterables(zzz_filter: null) {
    totalCount
  }
  b: allFilterables(zzz_filter: {}) {
    totalCount
  }
  c: allFilterables(zzz_filter: { text: null }) {
    totalCount
  }
  d: allFilterables(zzz_filter: { text: {} }) {
    totalCount
  }
  e: allFilterables(zzz_filter: { text: null, int4: null }) {
    totalCount
  }
  f: allFilterables(zzz_filter: { text: {}, int4: {} }) {
    totalCount
  }
  g: allFilterables(zzz_filter: { text: null, int4: {} }) {
    totalCount
  }
  h: allFilterables(zzz_filter: { text: { zzz_equalTo: null } }) {
    totalCount
  }
  i: allFilterables(zzz_filter: { text: { zzz_equalTo: null, zzz_notEqualTo: null } }) {
    totalCount
  }
  j: allFilterables(
    zzz_filter: {
      text: { zzz_equalTo: null, zzz_notEqualTo: null }
      int4: { zzz_equalTo: null }
      numeric: {}
      bool: null
    }
  ) {
    totalCount
  }
  k: allFilterables(zzz_filter: { zzz_and: null }) {
    totalCount
  }
  l: allFilterables(zzz_filter: { zzz_and: [{}] }) {
    totalCount
  }
  m: allFilterables(zzz_filter: { zzz_and: [{}, {}] }) {
    totalCount
  }
  n: allFilterables(zzz_filter: { zzz_or: null }) {
    totalCount
  }
  o: allFilterables(zzz_filter: { zzz_or: [{}] }) {
    totalCount
  }
  p: allFilterables(zzz_filter: { zzz_or: [{}, {}] }) {
    totalCount
  }
  q: allFilterables(zzz_filter: { zzz_not: null }) {
    totalCount
  }
  r: allFilterables(zzz_filter: { zzz_not: {} }) {
    totalCount
  }
  s: allFilterables(zzz_filter: { zzz_not: { text: null } }) {
    totalCount
  }
  t: allFilterables(zzz_filter: { zzz_not: { text: {} } }) {
    totalCount
  }
}
