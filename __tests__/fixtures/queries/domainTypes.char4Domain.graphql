query char4Domain($v2: String = "Test", $v3: String = "tEST") {
  distinctFrom: allDomainTypes(zzz_filter: { char4Domain: { zzz_distinctFrom: $v2 } }) {
    ...nodes
  }
  distinctFromInsensitive: allDomainTypes(zzz_filter: { char4Domain: { zzz_distinctFromInsensitive: $v2 } }) {
    ...nodes
  }
  endsWith: allDomainTypes(zzz_filter: { char4Domain: { zzz_endsWith: "T" } }) {
    ...nodes
  }
  endsWithInsensitive: allDomainTypes(
    zzz_filter: { char4Domain: { zzz_endsWithInsensitive: "T" } }
  ) {
    ...nodes
  }
  equalTo: allDomainTypes(zzz_filter: { char4Domain: { zzz_equalTo: $v2 } }) {
    ...nodes
  }
  equalToInsensitive: allDomainTypes(zzz_filter: { char4Domain: { zzz_equalToInsensitive: $v2 } }) {
    ...nodes
  }
  greaterThan: allDomainTypes(zzz_filter: { char4Domain: { zzz_greaterThan: $v2 } }) {
    ...nodes
  }
  greaterThanInsensitive: allDomainTypes(zzz_filter: { char4Domain: { zzz_greaterThanInsensitive: $v2 } }) {
    ...nodes
  }
  greaterThanOrEqualTo: allDomainTypes(
    zzz_filter: { char4Domain: { zzz_greaterThanOrEqualTo: $v2 } }
  ) {
    ...nodes
  }
  greaterThanOrEqualToInsensitive: allDomainTypes(
    zzz_filter: { char4Domain: { zzz_greaterThanOrEqualToInsensitive: $v2 } }
  ) {
    ...nodes
  }
  in: allDomainTypes(zzz_filter: { char4Domain: { zzz_in: [$v2, $v3] } }) {
    ...nodes
  }
  inInsensitive: allDomainTypes(zzz_filter: { char4Domain: { zzz_inInsensitive: [$v2, $v3] } }) {
    ...nodes
  }
  includes: allDomainTypes(zzz_filter: { char4Domain: { zzz_includes: "T" } }) {
    ...nodes
  }
  includesInsensitive: allDomainTypes(
    zzz_filter: { char4Domain: { zzz_includesInsensitive: "T" } }
  ) {
    ...nodes
  }
  isNull: allDomainTypes(zzz_filter: { char4Domain: { zzz_isNull: true } }) {
    ...nodes
  }
  lessThan: allDomainTypes(zzz_filter: { char4Domain: { zzz_lessThan: $v2 } }) {
    ...nodes
  }
  lessThanInsensitive: allDomainTypes(zzz_filter: { char4Domain: { zzz_lessThanInsensitive: $v2 } }) {
    ...nodes
  }
  lessThanOrEqualTo: allDomainTypes(
    zzz_filter: { char4Domain: { zzz_lessThanOrEqualTo: $v2 } }
  ) {
    ...nodes
  }
  lessThanOrEqualToInsensitive: allDomainTypes(
    zzz_filter: { char4Domain: { zzz_lessThanOrEqualToInsensitive: $v2 } }
  ) {
    ...nodes
  }
  like: allDomainTypes(zzz_filter: { char4Domain: { zzz_like: "%ES%" } }) {
    ...nodes
  }
  likeInsensitive: allDomainTypes(
    zzz_filter: { char4Domain: { zzz_likeInsensitive: "%ES%" } }
  ) {
    ...nodes
  }
  notDistinctFrom: allDomainTypes(
    zzz_filter: { char4Domain: { zzz_notDistinctFrom: $v2 } }
  ) {
    ...nodes
  }
  notDistinctFromInsensitive: allDomainTypes(zzz_filter: { char4Domain: { zzz_notDistinctFromInsensitive: $v2 } }) {
    ...nodes
  }
  notEndsWith: allDomainTypes(zzz_filter: { char4Domain: { zzz_notEndsWith: "T" } }) {
    ...nodes
  }
  notEndsWithInsensitive: allDomainTypes(
    zzz_filter: { char4Domain: { zzz_notEndsWithInsensitive: "T" } }
  ) {
    ...nodes
  }
  notEqualTo: allDomainTypes(zzz_filter: { char4Domain: { zzz_notEqualTo: $v2 } }) {
    ...nodes
  }
  notEqualToInsensitive: allDomainTypes(zzz_filter: { char4Domain: { zzz_notEqualToInsensitive: $v2 } }) {
    ...nodes
  }
  notIn: allDomainTypes(zzz_filter: { char4Domain: { zzz_notIn: [$v2] } }) {
    ...nodes
  }
  notInInsensitive: allDomainTypes(zzz_filter: { char4Domain: { zzz_notInInsensitive: [$v2] } }) {
    ...nodes
  }
  notIncludes: allDomainTypes(zzz_filter: { char4Domain: { zzz_notIncludes: "T" } }) {
    ...nodes
  }
  notIncludesInsensitive: allDomainTypes(
    zzz_filter: { char4Domain: { zzz_notIncludesInsensitive: "T" } }
  ) {
    ...nodes
  }
  notLike: allDomainTypes(zzz_filter: { char4Domain: { zzz_notLike: "%ES%" } }) {
    ...nodes
  }
  notLikeInsensitive: allDomainTypes(
    zzz_filter: { char4Domain: { zzz_notLikeInsensitive: "%ES%" } }
  ) {
    ...nodes
  }
  notStartsWith: allDomainTypes(
    zzz_filter: { char4Domain: { zzz_notStartsWith: "T" } }
  ) {
    ...nodes
  }
  notStartsWithInsensitive: allDomainTypes(
    zzz_filter: { char4Domain: { zzz_notStartsWithInsensitive: "T" } }
  ) {
    ...nodes
  }
  startsWith: allDomainTypes(zzz_filter: { char4Domain: { zzz_startsWith: "T" } }) {
    ...nodes
  }
  startsWithInsensitive: allDomainTypes(
    zzz_filter: { char4Domain: { zzz_startsWithInsensitive: "T" } }
  ) {
    ...nodes
  }
}

fragment nodes on DomainTypesConnection {
  nodes {
    id
  }
}
