query timestamptzRange(
  $val: DatetimeRangeInput = {
    start: { value: "1999-02-01 00:00", inclusive: true }
    end: { value: "1999-03-01 00:00", inclusive: false }
  }
  $elementVal: Datetime = "1999-02-01 00:00"
) {
  adjacentTo: allRangeTypes(
    zzz_filter: { timestamptzRange: { zzz_adjacentTo: $val } }
  ) {
    ...nodes
  }
  containedBy: allRangeTypes(
    zzz_filter: { timestamptzRange: { zzz_containedBy: $val } }
  ) {
    ...nodes
  }
  contains: allRangeTypes(zzz_filter: { timestamptzRange: { zzz_contains: $val } }) {
    ...nodes
  }
  containsElement: allRangeTypes(
    zzz_filter: { timestamptzRange: { zzz_containsElement: $elementVal } }
  ) {
    ...nodes
  }
  distinctFrom: allRangeTypes(
    zzz_filter: { timestamptzRange: { zzz_distinctFrom: $val } }
  ) {
    ...nodes
  }
  equalTo: allRangeTypes(zzz_filter: { timestamptzRange: { zzz_equalTo: $val } }) {
    ...nodes
  }
  in: allRangeTypes(zzz_filter: { timestamptzRange: { zzz_in: [$val] } }) {
    ...nodes
  }
  isNull: allRangeTypes(zzz_filter: { timestamptzRange: { zzz_isNull: true } }) {
    ...nodes
  }
  notDistinctFrom: allRangeTypes(
    zzz_filter: { timestamptzRange: { zzz_notDistinctFrom: $val } }
  ) {
    ...nodes
  }
  notEqualTo: allRangeTypes(
    zzz_filter: { timestamptzRange: { zzz_notEqualTo: $val } }
  ) {
    ...nodes
  }
  notExtendsLeftOf: allRangeTypes(
    zzz_filter: { timestamptzRange: { zzz_notExtendsLeftOf: $val } }
  ) {
    ...nodes
  }
  notExtendsRightOf: allRangeTypes(
    zzz_filter: { timestamptzRange: { zzz_notExtendsRightOf: $val } }
  ) {
    ...nodes
  }
  notIn: allRangeTypes(zzz_filter: { timestamptzRange: { zzz_notIn: [$val] } }) {
    ...nodes
  }
  overlaps: allRangeTypes(zzz_filter: { timestamptzRange: { zzz_overlaps: $val } }) {
    ...nodes
  }
  strictlyLeftOf: allRangeTypes(
    zzz_filter: { timestamptzRange: { zzz_strictlyLeftOf: $val } }
  ) {
    ...nodes
  }
  strictlyRightOf: allRangeTypes(
    zzz_filter: { timestamptzRange: { zzz_strictlyRightOf: $val } }
  ) {
    ...nodes
  }
}

fragment nodes on RangeTypesConnection {
  nodes {
    id
  }
}
