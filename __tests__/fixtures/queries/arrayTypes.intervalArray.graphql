query intervalArray(
  $v2: [IntervalInput] = [
    {
      seconds: 0
      minutes: 0
      hours: 0
      days: 2
      months: 0
      years: 0
    },
    {
      seconds: 0
      minutes: 0
      hours: 0
      days: 3
      months: 0
      years: 0
    }
  ]
  $v2_1: IntervalInput = {
    seconds: 0
    minutes: 0
    hours: 0
    days: 2
    months: 0
    years: 0
  }
  $v3: [IntervalInput] = [
    {
      seconds: 0
      minutes: 0
      hours: 0
      days: 3
      months: 0
      years: 0
    },
    {
      seconds: 0
      minutes: 0
      hours: 0
      days: 4
      months: 0
      years: 0
    }
  ]
) {
  anyEqualTo: allArrayTypes(zzz_filter: { intervalArray: { zzz_anyEqualTo: $v2_1 } }) {
    ...nodes
  }
  anyGreaterThan: allArrayTypes(
    zzz_filter: { intervalArray: { zzz_anyGreaterThan: $v2_1 } }
  ) {
    ...nodes
  }
  anyGreaterThanOrEqualTo: allArrayTypes(
    zzz_filter: { intervalArray: { zzz_anyGreaterThanOrEqualTo: $v2_1 } }
  ) {
    ...nodes
  }
  anyLessThan: allArrayTypes(zzz_filter: { intervalArray: { zzz_anyLessThan: $v2_1 } }) {
    ...nodes
  }
  anyLessThanOrEqualTo: allArrayTypes(
    zzz_filter: { intervalArray: { zzz_anyLessThanOrEqualTo: $v2_1 } }
  ) {
    ...nodes
  }
  anyNotEqualTo: allArrayTypes(
    zzz_filter: { intervalArray: { zzz_anyNotEqualTo: $v2_1 } }
  ) {
    ...nodes
  }
  containedBy: allArrayTypes(zzz_filter: { intervalArray: { zzz_containedBy: $v2 } }) {
    ...nodes
  }
  contains: allArrayTypes(zzz_filter: { intervalArray: { zzz_contains: $v3 } }) {
    ...nodes
  }
  distinctFrom: allArrayTypes(zzz_filter: { intervalArray: { zzz_distinctFrom: $v2 } }) {
    ...nodes
  }
  equalTo: allArrayTypes(zzz_filter: { intervalArray: { zzz_equalTo: $v2 } }) {
    ...nodes
  }
  greaterThan: allArrayTypes(zzz_filter: { intervalArray: { zzz_greaterThan: $v2 } }) {
    ...nodes
  }
  greaterThanOrEqualTo: allArrayTypes(
    zzz_filter: { intervalArray: { zzz_greaterThanOrEqualTo: $v2 } }
  ) {
    ...nodes
  }
  isNull: allArrayTypes(zzz_filter: { intervalArray: { zzz_isNull: true } }) {
    ...nodes
  }
  lessThan: allArrayTypes(zzz_filter: { intervalArray: { zzz_lessThan: $v2 } }) {
    ...nodes
  }
  lessThanOrEqualTo: allArrayTypes(
    zzz_filter: { intervalArray: { zzz_lessThanOrEqualTo: $v2 } }
  ) {
    ...nodes
  }
  notDistinctFrom: allArrayTypes(
    zzz_filter: { intervalArray: { zzz_notDistinctFrom: $v2 } }
  ) {
    ...nodes
  }
  notEqualTo: allArrayTypes(zzz_filter: { intervalArray: { zzz_notEqualTo: $v2 } }) {
    ...nodes
  }
  overlaps: allArrayTypes(zzz_filter: { intervalArray: { zzz_overlaps: $v2 } }) {
    ...nodes
  }
}

fragment nodes on ArrayTypesConnection {
  nodes {
    id
  }
}
