  childrenExist_true: allFilterables(zzz_filter: {childrenByFilterableIdExist: true}) { ...childrenConnection }
  filterableClosuresByDescendantId_some_filterableByAncestorId_name_equalTo_Test: allFilterables(zzz_filter: { filterableClosuresByDescendantId: { some: { filterableByAncestorId: { name: { zzz_equalTo: "Test" } } } } }) { ...textConnection }
  forwardCompound_name_equalTo_forwardCompound12: allFilterables(zzz_filter: {forwardCompoundByForwardCompound1AndForwardCompound2: {name: {zzz_equalTo: "forwardCompound12"}}}) { ...textConnection }
