query text($v2: String = "Test", $v3: String = "tEST") {
  distinctFrom: allFilterables(zzz_filter: { text: { zzz_distinctFrom: $v2 } }) {
    ...nodes
  }
  distinctFromInsensitive: allFilterables(zzz_filter: { text: { zzz_distinctFromInsensitive: $v2 } }) {
    ...nodes
  }
  endsWith: allFilterables(zzz_filter: { text: { zzz_endsWith: "T" } }) {
    ...nodes
  }
  endsWithInsensitive: allFilterables(
    zzz_filter: { text: { zzz_endsWithInsensitive: "T" } }
  ) {
    ...nodes
  }
  equalTo: allFilterables(zzz_filter: { text: { zzz_equalTo: $v2 } }) {
    ...nodes
  }
  equalToInsensitive: allFilterables(zzz_filter: { text: { zzz_equalToInsensitive: $v2 } }) {
    ...nodes
  }
  greaterThan: allFilterables(zzz_filter: { text: { zzz_greaterThan: $v2 } }) {
    ...nodes
  }
  greaterThanInsensitive: allFilterables(zzz_filter: { text: { zzz_greaterThanInsensitive: $v2 } }) {
    ...nodes
  }
  greaterThanOrEqualTo: allFilterables(
    zzz_filter: { text: { zzz_greaterThanOrEqualTo: $v2 } }
  ) {
    ...nodes
  }
  greaterThanOrEqualToInsensitive: allFilterables(
    zzz_filter: { text: { zzz_greaterThanOrEqualToInsensitive: $v2 } }
  ) {
    ...nodes
  }
  in: allFilterables(zzz_filter: { text: { zzz_in: [$v2, $v3] } }) {
    ...nodes
  }
  inInsensitive: allFilterables(zzz_filter: { text: { zzz_inInsensitive: [$v2, $v3] } }) {
    ...nodes
  }
  includes: allFilterables(zzz_filter: { text: { zzz_includes: "T" } }) {
    ...nodes
  }
  includesInsensitive: allFilterables(
    zzz_filter: { text: { zzz_includesInsensitive: "T" } }
  ) {
    ...nodes
  }
  isNull: allFilterables(zzz_filter: { text: { zzz_isNull: true } }) {
    ...nodes
  }
  lessThan: allFilterables(zzz_filter: { text: { zzz_lessThan: $v2 } }) {
    ...nodes
  }
  lessThanInsensitive: allFilterables(zzz_filter: { text: { zzz_lessThanInsensitive: $v2 } }) {
    ...nodes
  }
  lessThanOrEqualTo: allFilterables(
    zzz_filter: { text: { zzz_lessThanOrEqualTo: $v2 } }
  ) {
    ...nodes
  }
  lessThanOrEqualToInsensitive: allFilterables(
    zzz_filter: { text: { zzz_lessThanOrEqualToInsensitive: $v2 } }
  ) {
    ...nodes
  }
  like: allFilterables(zzz_filter: { text: { zzz_like: "%ES%" } }) {
    ...nodes
  }
  likeInsensitive: allFilterables(
    zzz_filter: { text: { zzz_likeInsensitive: "%ES%" } }
  ) {
    ...nodes
  }
  notDistinctFrom: allFilterables(zzz_filter: { text: { zzz_notDistinctFrom: $v2 } }) {
    ...nodes
  }
  notDistinctFromInsensitive: allFilterables(zzz_filter: { text: { zzz_notDistinctFromInsensitive: $v2 } }) {
    ...nodes
  }
  notEndsWith: allFilterables(zzz_filter: { text: { zzz_notEndsWith: "T" } }) {
    ...nodes
  }
  notEndsWithInsensitive: allFilterables(
    zzz_filter: { text: { zzz_notEndsWithInsensitive: "T" } }
  ) {
    ...nodes
  }
  notEqualTo: allFilterables(zzz_filter: { text: { zzz_notEqualTo: $v2 } }) {
    ...nodes
  }
  notEqualToInsensitive: allFilterables(zzz_filter: { text: { zzz_notEqualToInsensitive: $v2 } }) {
    ...nodes
  }
  notIn: allFilterables(zzz_filter: { text: { zzz_notIn: [$v2] } }) {
    ...nodes
  }
  notInInsensitive: allFilterables(zzz_filter: { text: { zzz_notInInsensitive: [$v2] } }) {
    ...nodes
  }
  notIncludes: allFilterables(zzz_filter: { text: { zzz_notIncludes: "T" } }) {
    ...nodes
  }
  notIncludesInsensitive: allFilterables(
    zzz_filter: { text: { zzz_notIncludesInsensitive: "T" } }
  ) {
    ...nodes
  }
  notLike: allFilterables(zzz_filter: { text: { zzz_notLike: "%ES%" } }) {
    ...nodes
  }
  notLikeInsensitive: allFilterables(
    zzz_filter: { text: { zzz_notLikeInsensitive: "%ES%" } }
  ) {
    ...nodes
  }
  notStartsWith: allFilterables(zzz_filter: { text: { zzz_notStartsWith: "T" } }) {
    ...nodes
  }
  notStartsWithInsensitive: allFilterables(
    zzz_filter: { text: { zzz_notStartsWithInsensitive: "T" } }
  ) {
    ...nodes
  }
  startsWith: allFilterables(zzz_filter: { text: { zzz_startsWith: "T" } }) {
    ...nodes
  }
  startsWithInsensitive: allFilterables(
    zzz_filter: { text: { zzz_startsWithInsensitive: "T" } }
  ) {
    ...nodes
  }
}

fragment nodes on FilterablesConnection {
  nodes {
    id
  }
}
