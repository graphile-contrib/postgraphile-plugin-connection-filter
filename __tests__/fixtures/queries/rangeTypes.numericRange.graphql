query numericRange(
  $val: BigFloatRangeInput = {
    start: { value: "0.2", inclusive: true }
    end: { value: "0.3", inclusive: false }
  }
  $elementVal: BigFloat = "0.2"
) {
  adjacentTo: allRangeTypes(zzz_filter: { numericRange: { zzz_adjacentTo: $val } }) {
    ...nodes
  }
  containedBy: allRangeTypes(zzz_filter: { numericRange: { zzz_containedBy: $val } }) {
    ...nodes
  }
  contains: allRangeTypes(zzz_filter: { numericRange: { zzz_contains: $val } }) {
    ...nodes
  }
  containsElement: allRangeTypes(
    zzz_filter: { numericRange: { zzz_containsElement: $elementVal } }
  ) {
    ...nodes
  }
  distinctFrom: allRangeTypes(
    zzz_filter: { numericRange: { zzz_distinctFrom: $val } }
  ) {
    ...nodes
  }
  equalTo: allRangeTypes(zzz_filter: { numericRange: { zzz_equalTo: $val } }) {
    ...nodes
  }
  in: allRangeTypes(zzz_filter: { numericRange: { zzz_in: [$val] } }) {
    ...nodes
  }
  isNull: allRangeTypes(zzz_filter: { numericRange: { zzz_isNull: true } }) {
    ...nodes
  }
  notDistinctFrom: allRangeTypes(
    zzz_filter: { numericRange: { zzz_notDistinctFrom: $val } }
  ) {
    ...nodes
  }
  notEqualTo: allRangeTypes(zzz_filter: { numericRange: { zzz_notEqualTo: $val } }) {
    ...nodes
  }
  notExtendsLeftOf: allRangeTypes(
    zzz_filter: { numericRange: { zzz_notExtendsLeftOf: $val } }
  ) {
    ...nodes
  }
  notExtendsRightOf: allRangeTypes(
    zzz_filter: { numericRange: { zzz_notExtendsRightOf: $val } }
  ) {
    ...nodes
  }
  notIn: allRangeTypes(zzz_filter: { numericRange: { zzz_notIn: [$val] } }) {
    ...nodes
  }
  overlaps: allRangeTypes(zzz_filter: { numericRange: { zzz_overlaps: $val } }) {
    ...nodes
  }
  strictlyLeftOf: allRangeTypes(
    zzz_filter: { numericRange: { zzz_strictlyLeftOf: $val } }
  ) {
    ...nodes
  }
  strictlyRightOf: allRangeTypes(
    zzz_filter: { numericRange: { zzz_strictlyRightOf: $val } }
  ) {
    ...nodes
  }
}

fragment nodes on RangeTypesConnection {
  nodes {
    id
  }
}
