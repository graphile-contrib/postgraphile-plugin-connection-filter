  x_parent_name_equalTo_null: allFilterables(zzz_filter: {parentByParentId: {name: {zzz_equalTo: null}}}) { ...textConnection }
  x_parent_name_null: allFilterables(zzz_filter: {parentByParentId: {name: null}}) { ...textConnection }
