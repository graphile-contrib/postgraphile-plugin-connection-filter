query timeArray(
  $v2: [Time] = ["00:02:00", "00:03:00"]
  $v2_1: Time = "00:02:00"
  $v3: [Time] = ["00:03:00", "00:04:00"]
) {
  anyEqualTo: allArrayTypes(zzz_filter: { timeArray: { zzz_anyEqualTo: $v2_1 } }) {
    ...nodes
  }
  anyGreaterThan: allArrayTypes(
    zzz_filter: { timeArray: { zzz_anyGreaterThan: $v2_1 } }
  ) {
    ...nodes
  }
  anyGreaterThanOrEqualTo: allArrayTypes(
    zzz_filter: { timeArray: { zzz_anyGreaterThanOrEqualTo: $v2_1 } }
  ) {
    ...nodes
  }
  anyLessThan: allArrayTypes(zzz_filter: { timeArray: { zzz_anyLessThan: $v2_1 } }) {
    ...nodes
  }
  anyLessThanOrEqualTo: allArrayTypes(
    zzz_filter: { timeArray: { zzz_anyLessThanOrEqualTo: $v2_1 } }
  ) {
    ...nodes
  }
  anyNotEqualTo: allArrayTypes(
    zzz_filter: { timeArray: { zzz_anyNotEqualTo: $v2_1 } }
  ) {
    ...nodes
  }
  containedBy: allArrayTypes(zzz_filter: { timeArray: { zzz_containedBy: $v2 } }) {
    ...nodes
  }
  contains: allArrayTypes(zzz_filter: { timeArray: { zzz_contains: $v3 } }) {
    ...nodes
  }
  distinctFrom: allArrayTypes(zzz_filter: { timeArray: { zzz_distinctFrom: $v2 } }) {
    ...nodes
  }
  equalTo: allArrayTypes(zzz_filter: { timeArray: { zzz_equalTo: $v2 } }) {
    ...nodes
  }
  greaterThan: allArrayTypes(zzz_filter: { timeArray: { zzz_greaterThan: $v2 } }) {
    ...nodes
  }
  greaterThanOrEqualTo: allArrayTypes(
    zzz_filter: { timeArray: { zzz_greaterThanOrEqualTo: $v2 } }
  ) {
    ...nodes
  }
  isNull: allArrayTypes(zzz_filter: { timeArray: { zzz_isNull: true } }) {
    ...nodes
  }
  lessThan: allArrayTypes(zzz_filter: { timeArray: { zzz_lessThan: $v2 } }) {
    ...nodes
  }
  lessThanOrEqualTo: allArrayTypes(
    zzz_filter: { timeArray: { zzz_lessThanOrEqualTo: $v2 } }
  ) {
    ...nodes
  }
  notDistinctFrom: allArrayTypes(
    zzz_filter: { timeArray: { zzz_notDistinctFrom: $v2 } }
  ) {
    ...nodes
  }
  notEqualTo: allArrayTypes(zzz_filter: { timeArray: { zzz_notEqualTo: $v2 } }) {
    ...nodes
  }
  overlaps: allArrayTypes(zzz_filter: { timeArray: { zzz_overlaps: $v2 } }) {
    ...nodes
  }
}

fragment nodes on ArrayTypesConnection {
  nodes {
    id
  }
}
